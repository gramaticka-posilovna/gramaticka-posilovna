<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Návrhy vzhledu 18</title>
<style>
  /* Statické návrhy (18. kolo) — NEJSOU součástí appky. Horní lišta: víc přístupů. Historie: navrhy-vzhledu-zmeny.md */
  @font-face{ font-family:'Newsreader'; font-weight:500 700; src:url(../fonts/newsreader-latin.woff2) format('woff2'); }
  @font-face{ font-family:'Newsreader'; font-weight:500 700; src:url(../fonts/newsreader-latin-ext.woff2) format('woff2'); unicode-range:U+0100-02AF, U+1E00-1EFF; }
  @font-face{ font-family:'Inter'; font-weight:400 800; src:url(../fonts/inter-latin.woff2) format('woff2'); }
  @font-face{ font-family:'Inter'; font-weight:400 800; src:url(../fonts/inter-latin-ext.woff2) format('woff2'); unicode-range:U+0100-02AF, U+1E00-1EFF; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#EDEAE4; color:#22252B; font-family:Inter, system-ui, sans-serif; }
  .wrap{ max-width:1400px; margin:0 auto; padding:32px 16px 64px; }
  h1.page{ font-family:Newsreader, serif; font-size:32px; margin:0 0 8px; }
  .lead{ color:#6A6F78; margin:0 0 6px; max-width:860px; line-height:1.55; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill, 300px); gap:28px 22px; padding:22px 4px 10px; justify-content:start; }
  .col{ display:flex; flex-direction:column; }
  .phone{ width:300px; height:470px; border-radius:42px; border:10px solid #15171B; overflow:hidden; position:relative; box-shadow:0 18px 40px rgba(0,0,0,.18); }
  .cap{ font-size:13px; font-weight:700; text-align:center; margin:10px 0 4px; }
  .why{ font-size:12px; color:#6A6F78; line-height:1.5; margin:0; padding-left:18px; }
  .why li{ margin:3px 0; }
  .rec{ display:inline-block; background:#2F7A4A; color:#fff; font-size:10px; font-weight:800; letter-spacing:.06em; padding:2px 7px; border-radius:999px; margin-left:4px; vertical-align:1px; }

  .app{ position:absolute; inset:0; width:350px; height:570px; transform:scale(.8); transform-origin:0 0; overflow:hidden;
    color:#1B2A41; background:radial-gradient(120% 60% at 50% 0%, #F3F6F9 0%, #E1E8EF 60%, #CDD7E2 100%); }
  .sb{ height:54px; display:flex; align-items:center; justify-content:space-between; padding:0 30px 0 36px; font:600 16px Inter; position:relative; }
  .sb::before{ content:""; position:absolute; left:50%; top:12px; transform:translateX(-50%); width:118px; height:34px; border-radius:20px; background:#000; }
  .sb .bat{ display:inline-block; width:24px; height:12px; border:1.5px solid currentColor; border-radius:4px; padding:1px; vertical-align:-1px; }
  .sb .bat i{ display:block; width:60%; height:100%; background:currentColor; border-radius:2px; }
  .mark{ width:26px; height:26px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle, #2F343C 0 49%, #9AA0A7 50% 53%, #2F343C 54% 62%, #1D2026 63% 67%, #2F343C 68%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.15), 0 3px 6px rgba(0,0,0,.2); color:#F2C230; font:700 12px Newsreader, serif; }
  .bar{ display:flex; align-items:center; gap:8px; padding:4px 16px 0; margin-bottom:14px; }
  .body{ padding:0 16px; }
  .home-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; }
  .day{ font-size:14px; color:#5C6478; }
  .hello{ font:700 30px Newsreader, serif; margin:2px 0 0; }
  .splate{ width:58px; height:58px; border-radius:50%; display:grid; place-items:center; margin:0 auto 4px;
    background:radial-gradient(circle, #2F343C 0 49%, #9AA0A7 50% 52%, #2F343C 53% 61%, #1D2026 62% 66%, #2F343C 67%); box-shadow:inset 0 2px 0 rgba(255,255,255,.15), 0 8px 14px rgba(0,0,0,.3); }
  .splate b{ font:700 22px Newsreader, serif; color:#F2C230; }
  .streak small{ display:block; text-align:center; font-size:10px; font-weight:800; text-transform:uppercase; color:#5C6478; }
  .card{ background:linear-gradient(180deg,#fff,#F6F8FA); border-radius:20px; padding:18px; box-shadow:inset 0 1px 0 #fff, 0 10px 22px rgba(60,75,100,.16); margin-bottom:14px; }
  .label{ font-size:11px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:#6E8F5C; margin:0 0 10px; }
  .goal{ display:flex; justify-content:space-between; align-items:baseline; }
  .goal b{ font:700 22px Newsreader, serif; }
  .goal span{ font-size:14px; color:#5C6478; }
  .gbar{ height:12px; margin-top:10px; background:#D9E1EA; border-radius:8px; overflow:hidden; }
  .gbar span{ display:block; width:60%; height:100%; background:linear-gradient(180deg,#9CC487,#567F45); }
  .cta{ text-align:center; color:#fff; border-radius:18px; padding:14px; font-weight:700; font-size:16px; background:linear-gradient(180deg,#33598A,#1E3A5F); box-shadow:0 5px 0 #132840; }
  /* malé kotoučky série v liště */
  .chip{ margin-left:auto; display:flex; align-items:center; gap:6px; background:#fff; border-radius:999px; padding:4px 10px 4px 4px; box-shadow:0 3px 8px rgba(60,75,100,.14); font:800 12px Inter; }
  .chip .mark{ width:24px; height:24px; font:700 12px Newsreader, serif; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="page">Návrhy vzhledu · 18. kolo · horní lišta, víc možností</h1>
  <p class="lead">Dnešní lehká lišta (vlevo nahoře) a sedm jiných přístupů, od žádné lišty po výraznou. Ukázaná je obrazovka Domů pod stavovým řádkem iPhonu. Pod každou variantou je i to, co by se dělo na ostatních obrazovkách a v testu.</p>
  <div class="grid" id="grid"></div>
</div>
<script>
const sb = (dark) => `<div class="sb" style="color:${dark ? "#fff" : "#1B2A41"}"><span>14:16</span><span>▂▄▆ <span class="bat"><i></i></span></span></div>`;
const streak = '<div class="streak"><div class="splate"><b>6</b></div><small>dní v řadě</small></div>';
const head = (dayText, withStreak = true) => `<div class="home-head"><div>${dayText === null ? "" : `<div class="day">${dayText}</div>`}<div class="hello">Dobrý den!</div></div>${withStreak ? streak : ""}</div>`;
const rest = `
  <div class="card"><p class="label">Dnešní cíl</p><div class="goal"><b>12 / 20 odpovědí</b><span>už jen 8</span></div><div class="gbar"><span></span></div></div>
  <div class="cta">Pokračovat v tréninku</div>`;
const V = [
  ["Dnes · lehká lišta",
    `${sb()}<div class="bar"><div class="mark">G</div><b style="font:700 16px Newsreader,serif;color:#5C6478">Gramatická posilovna</b></div><div class="body">${head("Pondělí")}${rest}</div>`,
    ["Pro srovnání: to, co je teď v appce."]],
  ["A · Bez lišty",
    `${sb()}<div class="body" style="padding-top:8px">${head("Pondělí")}${rest}</div>`,
    ["Nahoře nic, obsah začíná pozdravem.", "Název appky je na ikoně na ploše, v appce ho opakovat netřeba (tak to má většina aplikací v iPhonu).", "V testu je nahoře rovnou otázka – nejvíc místa."], true],
  ["B · Název uprostřed",
    `${sb()}<div style="text-align:center;font:800 11px Inter;letter-spacing:.16em;color:#8A94A6;margin:2px 0 14px">GRAMATICKÁ POSILOVNA</div><div class="body">${head("Pondělí")}${rest}</div>`,
    ["Jen drobný název uprostřed, bez kotouče, jako nadpis v iOS.", "Nekonkuruje pozdravu ani kotouči série.", "V testu by zůstal (nezabírá skoro nic)."]],
  ["C · Název + série v liště",
    `${sb()}<div class="bar"><b style="font:700 18px Newsreader,serif">Gramatická posilovna</b><span class="chip"><span class="mark">6</span>dní v řadě</span></div><div class="body">${head("Pondělí", false)}${rest}</div>`,
    ["Lišta dostane smysl: série je vidět vždy, i v Pokroku a Tématech.", "Odpadne zdvojení kotouč G + kotouč série.", "Velký kotouč série u pozdravu se ale zmenší."]],
  ["D · Datum v liště",
    `${sb()}<div class="bar" style="justify-content:space-between"><span style="font:700 13px Inter;color:#5C6478">Pondělí 5. října</span><div class="mark">G</div></div><div class="body">${head(null)}${rest}</div>`,
    ["Vlevo den a datum, vpravo jen malý kotouč jako logo.", "Pozdrav pod tím už nemusí opakovat „Pondělí“.", "Na ostatních obrazovkách jen kotouč vpravo."]],
  ["E · Dvoubarevný nápis",
    `${sb()}<div class="bar"><span style="font:700 20px Newsreader,serif;letter-spacing:-.01em">Gramatická <span style="color:#6E8F5C">posilovna</span></span></div><div class="body">${head("Pondělí")}${rest}</div>`,
    ["Bez kotouče, jen název – „posilovna“ zelenou barvou štítků.", "Působí jako logo z jednoho kusu, žádné zdvojené kotouče."]],
  ["F · Tmavý pruh",
    `<div style="background:#1E2A3A;color:#fff;padding-bottom:12px;margin-bottom:16px;border-radius:0 0 22px 22px">${sb(true)}<div class="bar" style="margin:0"><div class="mark">G</div><b style="font:700 18px Newsreader,serif;color:#fff">Gramatická <span style="color:#F2C230">posilovna</span></b></div></div><div class="body">${head("Pondělí")}${rest}</div>`,
    ["Výrazná hlavička v barvě kotoučů, název bíle a žlutě.", "Nejvíc „značková“, ale nejtěžší – na malém displeji ubírá místo.", "Ve tmavém režimu by splývala s pozadím."]],
  ["G · Kotouč místo slova „Pondělí“",
    `${sb()}<div class="body" style="padding-top:8px"><div class="home-head"><div><div class="day" style="display:flex;align-items:center;gap:6px"><span class="mark" style="width:20px;height:20px;font-size:10px">G</span>Gramatická posilovna · pondělí</div><div class="hello">Dobrý den!</div></div>${streak}</div>${rest}</div>`,
    ["Žádná lišta; malý kotouč a název jsou v řádku nad pozdravem spolu se dnem.", "Značka je součástí pozdravu, ne zvláštní pruh.", "Na ostatních obrazovkách nahoře nic."]]
];
document.getElementById("grid").innerHTML = V.map(([cap, html, why, rec]) => `
  <div class="col">
    <div class="phone"><div class="app">${html}</div></div>
    <p class="cap">${cap}${rec ? '<span class="rec">DOPORUČUJU</span>' : ""}</p>
    <ul class="why">${why.map(w => `<li>${w}</li>`).join("")}</ul>
  </div>`).join("");
</script>
</body>
</html>
